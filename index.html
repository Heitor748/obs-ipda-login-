<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OBS IPDA 2 - Login</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #101419; color: #F4F7FA; font-family: "Segoe UI", Arial, sans-serif; text-align: center; }
  main { max-width: 420px; padding: 24px; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  p { color: #AAB5C2; line-height: 1.5; }
</style>
</head>
<body>
<main>
  <h1>OBS IPDA 2</h1>
  <p id="msg">Voltando para o programa…</p>
</main>
<script>
  // Esta página só repassa o retorno do login da Meta para o programa no seu PC.
  // Não guarda nada: o código passa apenas pelo seu navegador.
  var params = window.location.search || "";
  if (params.indexOf("code=") !== -1 || params.indexOf("error=") !== -1) {
    window.location.replace("http://localhost:53682/" + params);
  } else {
    document.getElementById("msg").textContent = "Esta página faz parte do OBS IPDA 2. Feche esta janela.";
  }
</script>
</body>
</html>
